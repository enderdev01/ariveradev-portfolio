name: PR Policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Enforce issue-first policy
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body, linked issue, and labels
        uses: actions/github-script@v7
        with:
          script: |
            const APPROVED_LABEL = 'status:approved';
            const TYPE_LABEL_RE = /^type:/i;

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Read fresh PR data so `edited` events see the current body/labels.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const errors = [];

            // 1. The PR body must close-link at least one issue in this same
            // repository using a valid closing keyword (Closes/Fixes/
            // Resolves, case-insensitive). A bare `#N` mention does not
            // satisfy the gate.
            const body = pr.body || '';
            const refs = new Set();
            const closingKeyword = '(?:closes|fixes|resolves)\\s+';
            const sameRepoRef = new RegExp('\\b' + closingKeyword + '#(\\d+)\\b', 'gi');
            const crossRepoRef = new RegExp('\\b' + closingKeyword + '([\\w.-]+)/([\\w.-]+)#(\\d+)\\b', 'gi');
            for (const m of body.matchAll(sameRepoRef)) {
              refs.add(Number(m[1]));
            }
            for (const m of body.matchAll(crossRepoRef)) {
              // Cross-repo references are out of scope for this policy.
              if (m[1] === owner && m[2] === repo) {
                refs.add(Number(m[3]));
              }
            }

            if (refs.size === 0) {
              errors.push(
                'PR body does not close-link any issue. Add a reference such as ' +
                '`Closes #N`, `Fixes #N`, or `Resolves #N` to an issue in this repository.'
              );
            } else {
              // 2. At least one close-linked same-repo issue must carry
              // `status:approved`. References resolving to a pull request
              // are rejected; only a real issue can satisfy approval.
              const approved = [];
              for (const issueNumber of refs) {
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: issueNumber,
                  });
                  if (issue.pull_request) {
                    core.info(
                      `Reference #${issueNumber} resolves to a pull request, not an issue; it cannot satisfy approval.`
                    );
                    continue;
                  }
                  const hasApproval = (issue.labels || []).some(
                    (label) => (typeof label === 'string' ? label : label.name) === APPROVED_LABEL
                  );
                  if (hasApproval) {
                    approved.push(`#${issueNumber}`);
                  }
                } catch (err) {
                  if (err.status === 404) {
                    errors.push(`Linked issue #${issueNumber} was not found in this repository.`);
                  } else {
                    throw err;
                  }
                }
              }
              if (approved.length === 0) {
                errors.push(
                  'No close-linked issue carries the `status:approved` label. ' +
                  'Issue-first policy requires approval on the linked issue before the PR.'
                );
              } else {
                core.info(`Approved linked issue(s): ${approved.join(', ')}`);
              }
            }

            // 3. Exactly one `type:*` label on the PR.
            const typeLabels = (pr.labels || []).map(
              (label) => (typeof label === 'string' ? label : label.name)
            ).filter((name) => TYPE_LABEL_RE.test(name));

            if (typeLabels.length === 1) {
              core.info(`PR type label: ${typeLabels[0]}`);
            } else if (typeLabels.length === 0) {
              errors.push(
                'PR has no `type:*` label. Apply exactly one (e.g. `type:feature`).'
              );
            } else {
              errors.push(
                `PR has ${typeLabels.length} type labels (${typeLabels.join(', ')}). ` +
                'Exactly one is required.'
              );
            }

            if (errors.length > 0) {
              core.setFailed(
                'PR policy failed:\n' +
                errors.map((e) => `- ${e}`).join('\n')
              );
              return;
            }
            core.info('PR policy satisfied.');
