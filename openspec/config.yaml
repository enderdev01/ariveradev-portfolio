# openspec/config.yaml
schema: spec-driven

context: |
  Next.js 13 (pages router) + Tailwind CSS 3 marketing site.
  Spanish-language site for software studio "OniLabs" (onilabs.site).
  Deps: next 13.1.6, react 18.2.0, nodemailer, react-icons, @next/font.
  No test runner configured. ESLint via next/core-web-vitals.
  src/{components,data,lib,pages,styles}; pages/{api,proyectos,servicios}.

strict_tdd: false

testing:
  projects:
    - path: "."
      stack: "next.js (pages router)"
      test_command: null
      framework: null
      unit: false
      integration: false
      e2e: false
      coverage: false
      linter:
        available: true
        command: "npm run lint"
      type_checker:
        available: false
        command: null
      formatter:
        available: false
        command: null

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing Next.js pages-router and Tailwind conventions
      - Keep marketing copy in Spanish consistent with existing content
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
